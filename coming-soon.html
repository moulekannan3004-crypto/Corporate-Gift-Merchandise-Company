<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>

  <link rel="stylesheet" href="assets/css/style.css">

<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6 text-center">
