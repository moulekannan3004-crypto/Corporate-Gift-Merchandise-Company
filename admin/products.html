<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog & Inventory | Enterprise Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="dashboard-sidebar">
      <div>
        <div class="sidebar-header bg-slate-950 text-white">
          <a href="../index.html" class="brand-logo text-base">
            <div class="logo-icon !w-8 !h-8 !text-base bg-indigo-600"><i class="bi bi-shield-lock-fill text-white"></i></div>
            <span class="text-white">ADMIN<span class="text-indigo-400">.VANGUARD</span></span>
          </a>
        </div>
        <ul class="sidebar-menu">
          <li class="sidebar-item"><a href="index.html" class="sidebar-link"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="sidebar-item"><a href="analytics.html" class="sidebar-link"><i class="bi bi-graph-up-arrow"></i> Revenue Analytics</a></li>
          <li class="sidebar-item"><a href="users.html" class="sidebar-link"><i class="bi bi-people"></i> Client Users</a></li>
          <li class="sidebar-item"><a href="orders.html" class="sidebar-link"><i class="bi bi-box-seam"></i> Order Manager</a></li>
          <li class="sidebar-item"><a href="messages.html" class="sidebar-link"><i class="bi bi-chat-left-dots"></i> Messages & Support</a></li>
        </ul>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <h2 class="font-bold text-lg">Product Catalog & MOQ Manager</h2>
      </header>

      <div class="p-6">
        <div class="data-table-container">
          <table class="custom-table">
            <thead>
              <tr>
                <th>Item Name</th>
                <th>Category</th>
                <th>Base MOQ</th>
                <th>Stock Level</th>
                <th>Supplier</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="font-bold">Executive Onboarding Box</td>
                <td>Executive Kits</td>
                <td>100 Units</td>
                <td><span class="badge-emerald text-[10px]">1,200 Units</span></td>
                <td>Vanguard Hub Chennai</td>
                <td><button class="btn-outline !py-1 !px-2 text-xs">Edit Product</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
