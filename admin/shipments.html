<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courier Dispatch | Enterprise Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
  <div class="dashboard-wrapper">
    <aside class="dashboard-sidebar border-indigo-500/20">
      <div>
        <div class="sidebar-header bg-slate-950 text-white">
          <a href="../index.html" class="brand-logo text-base">
            <div class="logo-icon !w-8 !h-8 !text-base bg-indigo-600"><i class="bi bi-shield-lock-fill text-white"></i></div>
            <span class="text-white">ADMIN<span class="text-indigo-400">.VANGUARD</span></span>
          </a>
        </div>
        <ul class="sidebar-menu">
          <li class="sidebar-item"><a href="index.html" class="sidebar-link"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
          <li class="sidebar-item"><a href="shipments.html" class="sidebar-link active"><i class="bi bi-truck"></i> Courier Dispatch</a></li>
        </ul>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-topbar">
        <h2 class="font-extrabold text-lg flex items-center gap-2"><i class="bi bi-truck text-indigo-400"></i> Multi-City Desk Drop Telemetry</h2>
      </header>

      <div class="p-6">
        <div class="glass-card p-5 rounded-2xl border border-slate-200 dark:border-slate-800">
          <table class="w-full text-left text-xs sm:text-sm">
            <thead class="bg-slate-100 dark:bg-slate-900 font-extrabold text-[11px] uppercase">
              <tr>
                <th class="p-4">Tracking AWB</th>
                <th class="p-4">Destination Hub</th>
                <th class="p-4">Recipients</th>
                <th class="p-4">Status</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
              <tr>
                <td class="p-4 font-bold text-indigo-500">#AWB-99812-IN</td>
                <td class="p-4">OMR IT Corridor, Chennai</td>
                <td class="p-4">250 Desk Drops</td>
                <td class="p-4"><span class="badge-emerald text-[10px]">Delivered Today</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
