<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Vanguard Gift & Co.</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6">

  <!-- Centered Login Card -->
  <div class="glass-card max-w-md w-full p-8 rounded-2xl shadow-2xl border border-slate-800 bg-slate-900/95 backdrop-blur-xl">
    
    <!-- Brand Logo Header -->
    <div class="text-center mb-6">
      <a href="index.html" class="brand-logo inline-flex justify-center mb-3">
        <img src="assets/images/favicon.svg" alt="Vanguard Gift" class="logo-img">
        <span class="text-white">VANGUARD<span class="text-amber-500">.GIFT</span></span>
      </a>
      <p class="text-xs text-slate-400">Enterprise Corporate Gifting & Procurement Platform</p>
    </div>

    <!-- Segmented Tab Switcher (User Login / Dashboard) -->
    <div class="p-1 bg-slate-950 rounded-2xl border border-slate-800 flex items-center gap-1 mb-6">
      <button id="tabUserLogin" type="button" class="w-1/2 py-2.5 px-3 text-xs font-bold rounded-xl transition-all border border-amber-500 bg-amber-500/10 text-amber-500 flex items-center justify-center gap-1.5 shadow-sm" onclick="switchLoginMode('user')">
        <i class="bi bi-person-circle"></i> User Login
      </button>
      <button id="tabAdminLogin" type="button" class="w-1/2 py-2.5 px-3 text-xs font-bold rounded-xl transition-all border border-transparent bg-transparent text-slate-400 hover:text-white flex items-center justify-center gap-1.5" onclick="switchLoginMode('admin')">
        <i class="bi bi-shield-lock-fill"></i> Dashboard
      </button>
    </div>

    <!-- Form Title & Badge -->
    <div class="flex items-center justify-between mb-2">
      <h3 id="formTitle" class="text-xl font-extrabold text-white">User / Client Login</h3>
      <span id="formBadge" class="badge-gold text-[10px]"><i class="bi bi-person-check-fill"></i> Client Account</span>
    </div>
    <p id="formSubtitle" class="text-xs text-slate-400 mb-6">Enter your corporate credentials to manage orders</p>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
      
      <!-- Work Email Field -->
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-1">Corporate Work Email</label>
        <div class="relative">
          <input type="email" id="loginEmail" required placeholder="name@company.com" class="w-full p-3 text-xs rounded-xl border border-slate-800 bg-slate-950 text-white placeholder-slate-500 outline-none focus:border-amber-500 transition-colors ps-9">
          <i class="bi bi-envelope text-slate-500 absolute left-3 top-3.5 text-xs"></i>
        </div>
      </div>

      <!-- Password Field -->
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-bold text-slate-400">Password</label>
          <a href="#" class="text-[11px] text-amber-500 hover:underline">Forgot password?</a>
        </div>
        <div class="relative">
          <input type="password" id="loginPassword" required placeholder="Enter your password" class="w-full p-3 text-xs rounded-xl border border-slate-800 bg-slate-950 text-white placeholder-slate-500 outline-none focus:border-amber-500 transition-colors ps-9">
          <i class="bi bi-lock text-slate-500 absolute left-3 top-3.5 text-xs"></i>
        </div>
      </div>

      <!-- Remember Me Checkbox -->
      <div class="flex items-center justify-between text-xs text-slate-400 py-1">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked class="rounded border-slate-800 bg-slate-950 text-amber-500">
          <span>Remember this device</span>
        </label>
      </div>

      <!-- Main Submit Button -->
      <button id="submitLoginBtn" type="submit" class="btn-gold w-full text-xs py-3.5 font-extrabold shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
        <span>Sign In to User Portal</span> <i class="bi bi-arrow-right"></i>
      </button>

      <!-- SSO Divider -->
      <div class="relative my-4 text-center">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
        <div class="relative inline-block px-3 bg-slate-900 text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Or continue with</div>
      </div>

      <!-- Sign In With Google & Apple Buttons -->
      <div class="grid grid-cols-2 gap-3">
        <button type="button" onclick="alert('Google Enterprise SSO initiated!')" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-800 bg-slate-950/60 hover:bg-slate-800 text-xs font-bold text-white transition-all shadow-sm">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google
        </button>

        <button type="button" onclick="alert('Apple ID SSO initiated!')" class="flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl border border-slate-800 bg-slate-950/60 hover:bg-slate-800 text-xs font-bold text-white transition-all shadow-sm">
          <i class="bi bi-apple text-base"></i>
          Apple ID
        </button>
      </div>
    </form>

    <!-- Register Account Button Located Directly Down of Sign In Section -->
    <div id="contextFooter" class="pt-5 mt-6 border-t border-slate-800 text-center space-y-2">
      <div class="text-xs font-bold text-slate-400">Need a new enterprise corporate account?</div>
      <a href="register.html" class="w-full py-3 px-4 rounded-xl border border-amber-500/40 bg-amber-500/10 text-amber-400 hover:bg-amber-500 hover:text-slate-950 flex items-center justify-center gap-2 text-xs font-extrabold transition-all shadow-md">
        <i class="bi bi-building-add"></i> Register Account <i class="bi bi-arrow-right"></i>
      </a>
    </div>
  </div>

  <script src="assets/js/theme.js"></script>
  <script>
    let activeMode = 'user';

    function switchLoginMode(mode) {
      activeMode = mode;
      const userTab = document.getElementById('tabUserLogin');
      const adminTab = document.getElementById('tabAdminLogin');
      const title = document.getElementById('formTitle');
      const badge = document.getElementById('formBadge');
      const subtitle = document.getElementById('formSubtitle');
      const emailInput = document.getElementById('loginEmail');
      const passwordInput = document.getElementById('loginPassword');
      const submitBtn = document.getElementById('submitLoginBtn');
      const contextFooter = document.getElementById('contextFooter');

      emailInput.value = "";
      passwordInput.value = "";

      if (mode === 'user') {
        userTab.className = "w-1/2 py-2.5 px-3 text-xs font-bold rounded-xl transition-all border border-amber-500 bg-amber-500/10 text-amber-500 flex items-center justify-center gap-1.5 shadow-sm";
        adminTab.className = "w-1/2 py-2.5 px-3 text-xs font-bold rounded-xl transition-all border border-transparent bg-transparent text-slate-400 hover:text-white flex items-center justify-center gap-1.5";
        
        title.textContent = "User / Client Login";
        badge.className = "badge-gold text-[10px]";
        badge.innerHTML = `<i class="bi bi-person-check-fill"></i> Client Account`;
        subtitle.textContent = "Enter your corporate credentials to manage orders";
        emailInput.placeholder = "name@company.com";
        submitBtn.innerHTML = `<span>Sign In to User Portal</span> <i class="bi bi-arrow-right"></i>`;
        contextFooter.innerHTML = `
          <div class="text-xs font-bold text-slate-400">Need a new enterprise corporate account?</div>
          <a href="register.html" class="w-full py-3 px-4 rounded-xl border border-amber-500/40 bg-amber-500/10 text-amber-400 hover:bg-amber-500 hover:text-slate-950 flex items-center justify-center gap-2 text-xs font-extrabold transition-all shadow-md">
            <i class="bi bi-building-add"></i> Register Account <i class="bi bi-arrow-right"></i>
          </a>
        `;
      } else {
        adminTab.className = "w-1/2 py-2.5 px-3 text-xs font-bold rounded-xl transition-all border border-indigo-500 bg-indigo-500/10 text-indigo-400 flex items-center justify-center gap-1.5 shadow-sm";
        userTab.className = "w-1/2 py-2.5 px-3 text-xs font-bold rounded-xl transition-all border border-transparent bg-transparent text-slate-400 hover:text-white flex items-center justify-center gap-1.5";
        
        title.textContent = "Dashboard / Admin Login";
        badge.className = "badge-indigo text-[10px]";
        badge.innerHTML = `<i class="bi bi-shield-check"></i> System Administrator`;
        subtitle.textContent = "Enter admin credentials to access platform dashboard";
        emailInput.placeholder = "admin@company.com";
        submitBtn.innerHTML = `<span>Sign In to Admin Dashboard</span> <i class="bi bi-arrow-right"></i>`;
        contextFooter.innerHTML = `
          <div class="text-xs font-bold text-slate-400">Restricted administrative portal</div>
          <div class="text-[11px] text-slate-500">2FA authentication token verified upon sign-in</div>
        `;
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      localStorage.setItem('vanguard_logged_in', 'true');
      if (activeMode === 'user') {
        window.location.href = 'index.html';
      } else {
        window.location.href = 'admin/index.html';
      }
    }
  </script>
</body>
</html>
