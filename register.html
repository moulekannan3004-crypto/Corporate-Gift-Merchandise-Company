<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Corporate Account | Vanguard Gift & Co.</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">

  <div class="glass-card max-w-xl w-full p-8 rounded-2xl border border-slate-800 bg-slate-900/95 shadow-2xl backdrop-blur-xl">
    <div class="flex items-center justify-between mb-6">
      <a href="index.html" class="brand-logo inline-flex">
        <img src="assets/images/favicon.svg" alt="Vanguard Gift" class="logo-img">
        <span class="text-white font-extrabold">VANGUARD<span class="text-amber-500">.GIFT</span></span>
      </a>
      <a href="login.html" class="text-xs font-bold text-slate-400 hover:text-white flex items-center gap-1 transition-colors">
        <i class="bi bi-arrow-left"></i> Back to Login
      </a>
    </div>

    <h2 class="text-2xl font-extrabold text-white mb-1">Create Corporate Account</h2>
    <p class="text-xs text-slate-400 mb-6">Register your organization for enterprise volume pricing and custom portal access.</p>

    <form onsubmit="event.preventDefault(); localStorage.setItem('vanguard_logged_in', 'true'); window.location.href='index.html';" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Company Name</label>
          <input type="text" required placeholder="AXION Systems Inc." class="w-full p-3 text-xs rounded-xl border border-slate-800 bg-slate-950 text-white placeholder-slate-500 outline-none focus:border-amber-500 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Tax Reg / GSTIN Number</label>
          <input type="text" required placeholder="33AAAAA0000A1Z5" class="w-full p-3 text-xs rounded-xl border border-slate-800 bg-slate-950 text-white placeholder-slate-500 outline-none focus:border-amber-500 transition-colors">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Contact Person Name</label>
          <input type="text" required placeholder="Vikram Sharma" class="w-full p-3 text-xs rounded-xl border border-slate-800 bg-slate-950 text-white placeholder-slate-500 outline-none focus:border-amber-500 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1.5">Corporate Work Email</label>
          <input type="email" required placeholder="vikram@axiontech.com" class="w-full p-3 text-xs rounded-xl border border-slate-800 bg-slate-950 text-white placeholder-slate-500 outline-none focus:border-amber-500 transition-colors">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5">Account Password</label>
        <input type="password" required placeholder="••••••••••••" class="w-full p-3 text-xs rounded-xl border border-slate-800 bg-slate-950 text-white placeholder-slate-500 outline-none focus:border-amber-500 transition-colors">
      </div>

      <button type="submit" class="btn-gold w-full text-xs py-3.5 font-extrabold shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
        <span>Register & Launch Dashboard</span> <i class="bi bi-arrow-right"></i>
      </button>
      
      <div class="text-center text-xs text-slate-400 pt-3 border-t border-slate-800">
        Already have an account? <a href="login.html" class="text-amber-500 font-extrabold hover:underline">Sign In Here</a>
      </div>
    </form>
  </div>
  <script src="assets/js/theme.js"></script>
</body>
</html>
